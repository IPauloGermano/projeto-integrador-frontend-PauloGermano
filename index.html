<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLT — Tênis para ir além</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header_container">
        <img class="header_logo" src="images/tenis/logo/icon.png" alt="VOLT" />
      </div>
    </header>

    <main>
      <section class="icons">
        <h2 class="icons_title">Astros da Marca</h2>
        <p class="icons_subtitle">Modelos criados para máxima performance e estilo</p>

        <div class="grid">
          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Cyborb%202/front.png"
              alt="VOLT Cyborg 2"
            />
            <span class="card_name">VOLT Cyborg 2</span>
          </div>

          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Ikill%204/front.png"
              alt="VOLT Ikill 4"
            />
            <span class="card_name">VOLT Ikill 4</span>
          </div>

          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Amp%203/front.png"
              alt="VOLT Amp 3"
            />
            <span class="card_name">VOLT Amp 3</span>
          </div>

          <div class="card_box">
            <img
              src="images/tenis/VOLT%20Surge%2001/front.png"
              alt="VOLT Surge 01"
            />
            <span class="card_name">VOLT Surge 01</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
